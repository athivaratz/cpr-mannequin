; CPR training mannequin — see docs/DESIGN.md for the full spec.
[platformio]
default_envs = esp32dev, nano

[common]
build_flags =
  -DUSE_VL53L0X=1
lib_deps_sensors =
  bogde/HX711@0.7.5
  pololu/VL53L0X@1.3.1

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
build_src_filter = +<esp32/>
build_flags =
  ${common.build_flags}
  -DCPR_BOARD_ESP32=1
  ; Final hardware has a load cell, LEDs and a buzzer only.
  -DUSE_VL53L0X=0
  -DCPR_HAS_FOIL=0
  -DCPR_SERIAL_STREAM_DEFAULT=1
  ; Trim NimBLE to peripheral-only, single connection to save DRAM/Heap.
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
build_unflags = -DUSE_VL53L0X=1
lib_deps =
  bogde/HX711@0.7.5
  h2zero/NimBLE-Arduino@^2.1.0
lib_ignore = cpr_sim

; Arduino Nano with the new (Optiboot, 115200 upload) bootloader. This is what
; Arduino IDE / arduino-cli pick by default for "Arduino Nano", which is the
; board the original cpr_nano.ino sketch targeted. Use env:nano_oldbl for
; clones that still carry the old bootloader (upload at 57600).
[env:nano]
platform = atmelavr@5.3.0
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
build_src_filter = +<nano/>
build_flags =
  ${common.build_flags}
  -DCPR_BOARD_NANO=1
  -DCPR_CAL_PAIRS=16
  ; The full ToF stack does not fit in the Nano's 30 KB flash.
  ; See docs/OPEN_ISSUES.md; the code is still behind USE_VL53L0X.
  -DUSE_VL53L0X=0
build_unflags = -DUSE_VL53L0X=1
lib_deps = ${common.lib_deps_sensors}
lib_ignore = cpr_sim

[env:nano_oldbl]
extends = env:nano
board = nanoatmega328

[env:native]
platform = native@1.2.1
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
test_build_src = no
